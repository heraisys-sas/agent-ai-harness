# ---------------------------------------------------------------------------
# Rust - le langage qui se vibe-code le mieux (entretien Quentin Adam)
# Pourquoi : compilateur tres exigeant -> meilleure boucle de retroaction
# modele <-> compilateur. Langage uniforme ~10-15 ans, sans changement cassant.
# ---------------------------------------------------------------------------

# Deny warnings en CI : l'agent est force de corriger plutot que de masquer
RUSTFLAGS=-D warnings

CARGO_TARGET_DIR=target

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"          # pas de panique silencieuse en prod

[profile.dev]
debug = 1
overflow-checks = true   # detecter les overflows au dev, pas en prod
