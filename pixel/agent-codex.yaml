# ---------------------------------------------------------------------------
# pixel/agent-codex.yaml
# Configuration type pour un orchestrateur de code (Codex / Claude Code / Windsurf)
# afin d'appliquer le HARNIAS : le modele propose, le systeme verifie.
#
# Ici on branche des GATES et HOOKS : tant que les tests (couches 1-3) et le
# pentest (couche 4) ne passent pas, on ne laisse pas le code entrer.
# Adaptez aux options de votre orchestrateur.
# ---------------------------------------------------------------------------

policy:
  # On n'accepte RIEN sans specification ni tests (le 'code' devient jetable,
  # specs + tests = le vrai contrat).
  require_spec: true
  require_tests: true
  deny_warnings: true         # -D warnings (voir pixel/rust-flags.conf)
  max_edit_attempts: 8        # borne de boucle de correction

  # Couche 1 : tests unitaires au plus proche du code
  gates:
    unit:
      cmd: cargo test --lib -- --nocapture
      on_fail: block

    # Couche 2 : integration avec vrais services (Testcontainers / mocks)
    integration:
      cmd: cargo test --test integration -- --nocapture
      on_fail: block

    # Couche 3 : simulation distribuee (chaque commit, couteux mais non negociable)
    simulation:
      cmd: cargo test --release --test simulation -- --nocapture
      on_fail: block

    # Couche 4 : pentest automatique multi-modeles
    pentest:
      cmd: ./scripts/generic_pentest.sh
      on_fail: block

  hooks:
    before_commit:
      - make lint
      - make test
      - ./scripts/generic_pentest.sh --severity high
